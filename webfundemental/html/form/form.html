<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form action="/process" method="post">
        <div>
            <label for="first-name">First Name: *</label>
            <input type="text" id="first-name" name="first-name" required placeholder="Enter your first name">
        </div>
        <br>
        <div>
            <label for="last-name">Last Name: *</label>
            <input type="text" id="last-name" name="last-name" required placeholder="Enter your last name">
        </div>
        <br>
        <div>
            <label for="email">Email Address: *</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">
        </div>
        <br>
        <div>
            <label for="password">Password: *</label>
            <input type="password" id="password" name="password" required>
        </div>
        <br>
        <div>
            <label for="confirm-password">Confirm Password: *</label>
            <input type="password" id="confirm-password" name="confirm-password" required>
        </div>
        <br>
        <div>
            <label for="dob">Birthday:</label>
            <input type="date" id="dob" name="dob">
        </div>
        <br>
        <div>
            <label>Gender Identity:</label>
            <br>
            <input type="radio" value="male" name="gender">Male</input>
            <input type="radio" value="female" name="gender">Female</input>
            <input type="radio" value="non-binary" name="gender">Non-Binary</input>
            <input type="radio" value="prefer-not-to-answer" name="gender">Prefer not to answer</input>
        </div>
        <br>
        <div>
            <label for="bio">A short description of myself:</label>
            <br>
            <textarea id="bio" name="bio" rows="4" cols="50"></textarea>
        </div>
        <br>
        <div>
            <label for="favlan">Favorite Language:</label>
            <select id="favlan" name="favlan">
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="c++">C++</option>
            </select>
        </div>
        <br>
        <div>
            <input type="checkbox" id="updates" name="updates">
            <label for="updates">Yes, I would like to receive periodic email updates</label>
        </div>
        <br>
        <div>
            <button type="submit">Create Account</button>
        </div>
    </form>
    <p>* indicates a required field</p>
</body>
</html>
