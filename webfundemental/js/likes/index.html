<!doctype html>
<html lang="en">
  <link rel="stylesheet" href="style.css" />
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Likes</title>
  </head>
  <body>
    <header class="title"><h1>Network</h1></header>
    <div class="feed"><h2>Your Feed</h2></div>
    <section class="container">
      <div class="profile">
        <img src="./assets/default.png" alt="avatar" class="pic" />
        <a href="">Add an avatar</a>
        <p>James Doe</p>
      </div>
      <div class="all">
        <div class="box1">
          <div class="above">
            <h2>Neil M</h2>
            <div class="numlike">
              <p><span class="likeCount1">9</span> like(s)</p>
              <button style="background-color: #ffd966" class="btn1">
                like
              </button>
            </div>
          </div>
          <div class="below">
            <p>
              I just set up this new discord bot, let me know what you all
              think. <a href="">link</a>
            </p>
          </div>
        </div>
        <div class="box1">
          <div class="above">
            <h2>Nichole K</h2>
            <div class="numlike">
              <p><span class="likeCount2">12</span> like(s)</p>
              <button style="background-color: #ffd966" class="btn2">
                like
              </button>
            </div>
          </div>
          <div class="below">
            Just finished my <a href="">next comic</a>, check it out.
          </div>
        </div>
        <div class="box1">
          <div class="above">
            <h2>Jim R</h2>
            <div class="numlike">
              <p><span class="likeCount3">9</span> like(s)</p>
              <button style="background-color: #ffd966" class="btn3">
                like
              </button>
            </div>
          </div>
          <div class="below">
            I can't stop listening to the <a href="">new album</a>. who else is
            liking it?
          </div>
        </div>
      </div>
    </section>
  </body>
  <script src="likes.js"></script>
</html>
